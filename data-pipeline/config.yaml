database:
  # No path here on purpose. src/db.py resolves the monorepo root from its own location,
  # so fma_data.duckdb is found on any machine and any OS with no configuration at all.
  # A committed absolute path was correct on exactly one box and silently wrong on every
  # other — the same failure that made `campaign_dir` a required argument in camera-traps.
  # Set the DB_PATH env var to override (containers, or a one-off run against a copy).
  path: null

cr800:
  host: 100.97.202.90
  port: 2000
  pakbus_address: 1
  station_id: bosque_pehuen

open_meteo:
  latitude: -39.61
  longitude: -71.71
  fetch_interval_minutes: 60

watcher:
  incoming_dir: data/incoming

schedules:
  open_meteo_interval_minutes: 60
  cr800_interval_minutes: 10080   # weekly (7 * 24 * 60)

exports:
  output_dir: data/exports   # CSV snapshots for off-site redundancy

# camera_traps: REMOVED 2026-08-20.
# It listed four campaigns for `run_fetch.py --ct`. primavera_2025's entry pointed at
# `new_labeled_data_reviewed.dedup.csv`, which does not exist, so the loop skipped
# primavera with a warning and ingested `pv_2025_2026` -- a retired second review pass --
# as if it were a campaign. Both parsers behind it are deleted.
# The replacement reads camera-traps/data/campaigns/<campaign>/observations.parquet
# directly; there is no per-campaign CSV list to configure. See
# camera-traps/docs/V2-REVIEW.md sections 2.3 and 2.4.

